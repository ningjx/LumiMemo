name: Release

# 推 v*.*.* 标签自动发版；也可以在 Actions 页手动触发（填版本号，标签由工作流创建）
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（不带 v，例如 0.2.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          # 标签推送用标签名；手动触发用输入的版本号
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = "$env:RAW_VERSION" -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version '$env:RAW_VERSION' is not a supported version. Use a version such as 1.2.3."
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore src/LumiMemo.WinUI/LumiMemo.WinUI.csproj -r win-x64

      - name: Publish self-contained app
        shell: pwsh
        run: |
          # 发布到名为 LumiMemo 的目录：zip 里就是 LumiMemo/… 这一层，解压即得干净文件夹
          $publishDirectory = Join-Path $env:RUNNER_TEMP "LumiMemo"
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"

          # win-x64 发布配置：自包含（Windows App SDK 随包），**不能用单文件**——
          # WinUI 3 不支持 PublishSingleFile（原生依赖必须与 exe 同目录，单文件会在启动时
          # 静默失败），见 win-x64-singlefile.pubxml 顶部注释
          dotnet publish src/LumiMemo.WinUI/LumiMemo.WinUI.csproj `
            -c Release `
            --no-restore `
            -p:PublishProfile=win-x64 `
            -p:Version="${{ steps.version.outputs.value }}" `
            -o $publishDirectory

          # 调试符号不进发布包
          Get-ChildItem -LiteralPath $publishDirectory -Recurse -Filter *.pdb |
            Remove-Item -Force

          # 主 exe 换个对用户友好的名字：单实例锁与资源都不依赖文件名
          $publishedExecutable = Join-Path $publishDirectory "LumiMemo.WinUI.exe"
          if (-not (Test-Path -LiteralPath $publishedExecutable)) {
            throw "Published executable was not found at '$publishedExecutable'."
          }
          Rename-Item -LiteralPath $publishedExecutable -NewName "LumiMemo.exe"

          # 打 zip（含 LumiMemo 这一层目录）
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $releaseArchive = Join-Path $releaseDirectory "LumiMemo-win-x64.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $publishDirectory,
            $releaseArchive,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true)

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $bodyPath = Join-Path $env:RUNNER_TEMP "release-body.md"
          $body = "本版本细节见仓库 CHANGELOG.md。"

          if (Test-Path -LiteralPath "CHANGELOG.md") {
            $changelog = Get-Content -LiteralPath "CHANGELOG.md" -Raw -Encoding utf8
            # 摘出「## [<版本>]」那一段（到下一个二级标题为止）
            $pattern = "(?ms)^##\s*\[?$([regex]::Escape($env:VERSION))\]?.*?(?=^##\s|\z)"
            if ($changelog -match $pattern) {
              # 去掉标题行本身，只留正文
              $lines = $Matches[0] -split "`r?`n"
              $body = ($lines | Select-Object -Skip 1) -join "`n"
              $body = $body.Trim()
            }
          }

          Set-Content -LiteralPath $bodyPath -Value $body -Encoding utf8
          "path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: LumiMemo ${{ steps.version.outputs.tag }}
          # 手动触发时由本步骤创建标签（指向触发时所在的分支）；标签推送时就是已有标签
          tag_name: ${{ steps.version.outputs.tag }}
          # 带 - 的版本号（如 0.0.1-beta）自动标为预发布
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          # 发布说明取自 CHANGELOG 对应段落，再追加 GitHub 自动生成的新旧提交对比
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: release/LumiMemo-win-x64.zip
