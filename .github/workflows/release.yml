name: Release

# 推 v*.*.* 标签自动发版；也可以在 Actions 页手动触发（填版本号，标签由工作流创建）
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（不带 v，例如 0.2.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          # 标签推送用标签名；手动触发用输入的版本号
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = "$env:RAW_VERSION" -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version '$env:RAW_VERSION' is not a supported version. Use a version such as 1.2.3."
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore src/LumiMemo.WinUI/LumiMemo.WinUI.csproj -r win-x64

      - name: Publish single-file executable
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "LumiMemo-publish"
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"

          # 未打包 + 自包含 + 单文件。win-x64-singlefile.pubxml 里是官方文档要求的那组属性
          # （WindowsPackageType=None / WindowsAppSDKSelfContained / SelfContained /
          #  EnableMsixTooling / IncludeAllContentForSelfExtract / PublishSingleFile），
          # 且它是 Properties/PublishProfiles 下唯一被跟踪进仓库的配置。
          dotnet publish src/LumiMemo.WinUI/LumiMemo.WinUI.csproj `
            -c Release `
            --no-restore `
            -p:PublishProfile=win-x64-singlefile `
            -p:Version="${{ steps.version.outputs.value }}" `
            -o $publishDirectory

          # 资产名必须与 exe 名一致，**不要改名**：MRT 资源管理器按可执行文件名找
          # <同名>.pri，改名会让单文件包里的 LumiMemo.WinUI.pri 配不上对，
          # 启动时抛 stowed exception / 静默退出（2026-10-04 实测踩过两次）
          $publishedExecutable = Join-Path $publishDirectory "LumiMemo.WinUI.exe"
          if (-not (Test-Path -LiteralPath $publishedExecutable)) {
            throw "Published executable was not found at '$publishedExecutable'."
          }

          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Copy-Item -LiteralPath $publishedExecutable `
            -Destination (Join-Path $releaseDirectory "LumiMemo.WinUI.exe")

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $bodyPath = Join-Path $env:RUNNER_TEMP "release-body.md"
          $body = "本版本细节见仓库 CHANGELOG.md。"

          if (Test-Path -LiteralPath "CHANGELOG.md") {
            $changelog = Get-Content -LiteralPath "CHANGELOG.md" -Raw -Encoding utf8
            # 摘出「## [<版本>]」那一段（到下一个二级标题为止）
            $pattern = "(?ms)^##\s*\[?$([regex]::Escape($env:VERSION))\]?.*?(?=^##\s|\z)"
            if ($changelog -match $pattern) {
              # 去掉标题行本身，只留正文
              $lines = $Matches[0] -split "`r?`n"
              $body = ($lines | Select-Object -Skip 1) -join "`n"
              $body = $body.Trim()
            }
          }

          Set-Content -LiteralPath $bodyPath -Value $body -Encoding utf8
          "path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: LumiMemo ${{ steps.version.outputs.tag }}
          # 手动触发时由本步骤创建标签（指向触发时所在的分支）；标签推送时就是已有标签
          tag_name: ${{ steps.version.outputs.tag }}
          # 带 - 的版本号（如 0.0.1-beta）自动标为预发布
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          # 发布说明取自 CHANGELOG 对应段落，再追加 GitHub 自动生成的新旧提交对比
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: release/LumiMemo.WinUI.exe
